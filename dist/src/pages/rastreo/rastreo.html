<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rastreo de Envío - Syntax Logistics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700&family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <script type="module" crossorigin src="/assets/rastreo-FhTnSzBq.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/footer-CjuA6v9J.js">
    <link rel="stylesheet" crossorigin href="/assets/footer-D1ovcNbg.css">
    <link rel="stylesheet" crossorigin href="/assets/rastreo-C8HJH_ym.css">
    <link rel="stylesheet" crossorigin href="/assets/layout-xtgOoJI6.css">
  </head>

  <body>

    <div id="navbar"></div>

    <main class="page-container">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8 col-md-10">
            
            <div class="caja-rastreo p-4 p-md-5">
              <h2 class="titulo-rastreo mb-4">Rastreo de Envío</h2>
              
              <form id="form-rastreo" novalidate class="mb-5">
                <div class="form-group position-relative">
                  <label for="id-rastreo" class="form-label text-uppercase fw-bold small text-secondary">ID de rastreo</label>
                  <div class="input-group">
                    <input type="text" id="id-rastreo" class="form-control input-rastreo-id" placeholder="Ej. STX-123456-MX" required autocomplete="off">
                    <button class="btn btn-buscar-rastreo" type="submit">
                      <i class="bi bi-search me-1"></i> Buscar
                    </button>
                  </div>
                  <div class="invalid-feedback">Por favor, ingresa un número de guía válido.</div>
                </div>
              </form>

              <div id="resultado-rastreo" class="d-none">
                
                <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4 flex-wrap gap-2">
                  <div>
                    <h5 class="fw-bold mb-0 text-dark header-delivery">Delivery Time</h5>
                    <small class="text-muted">Tiempo estimado de entrega</small>
                  </div>
                  <div class="tiempo-estimado-badge" id="tiempo-entrega">
                    25 mins
                  </div>
                </div>

                <div class="timeline-contenedor">
                  
                  <div class="timeline-item completado">
                    <div class="timeline-status-icon">
                      <i class="bi bi-check-lg"></i>
                    </div>
                    <div class="timeline-contenido">
                      <div class="timeline-texto">Orden de envío aceptada</div>
                      <div class="timeline-tiempo">Hace 2 min</div>
                    </div>
                  </div>

                  <div class="timeline-item completado">
                    <div class="timeline-status-icon">
                      <i class="bi bi-check-lg"></i>
                    </div>
                    <div class="timeline-contenido">
                      <div class="timeline-texto">Paquete recolectado por el repartidor</div>
                      <div class="timeline-tiempo">Hace 5 min</div>
                    </div>
                  </div>

                  <div class="timeline-item en-progreso">
                    <div class="timeline-status-icon">
                      <div class="pulso-activo"></div>
                    </div>
                    <div class="timeline-contenido">
                      <div class="timeline-texto fw-bold text-dark">Unidad en tránsito hacia el destino</div>
                      <div class="timeline-tiempo">Hace 10 min</div>
                    </div>
                  </div>

                  <div class="timeline-item pendiente">
                    <div class="timeline-status-icon"></div>
                    <div class="timeline-contenido">
                      <div class="timeline-texto">Paquete entregado con éxito</div>
                      <div class="timeline-tiempo">Pendiente</div>
                    </div>
                  </div>

                </div> </div> </div> </div>
        </div>
      </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
