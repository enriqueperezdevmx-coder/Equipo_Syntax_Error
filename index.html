<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio</title>
    <!-- Tu CSS -->
    <!-- 1. SIEMPRE PRIMERO: colores globales del proyecto -->
    <link rel="stylesheet" href="/src/css/variables.css" />
    <!-- Fuentes del proyecto -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700&family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- 2. Bootstrap CSS: grid, componentes, utilidades -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- 3. Bootstrap Icons: íconos como bi-clipboard, bi-person, etc. -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- CSS de componentes compartidos -->
    <link rel="stylesheet" href="/src/css/navbar.css" />
    <link rel="stylesheet" href="/src/css/footer.css" />

    <!-- 4. CSS propio de esta página -->
    <link rel="stylesheet" href="./src/css/style.css" />

    <!-- Link de la pagina de inicio-->
    <link rel="stylesheet" href="/src/pages/inicio/inicio.css" />
  </head>
  <body>
    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Todo: lo que es único de esta página-->

    <main>
      <div id="inicio-container"></div>
    </main>

    <!-- Todo: FIN DEL CONTENIDO -->

    <!-- FOOTER: se inyecta automáticamente con footer.js, no tocar -->
    <div id="footer"></div>

    <script>
      fetch("./src/pages/inicio/inicio.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("inicio-container").innerHTML = data;
        });
    </script>

    <!-- Scripts -->
    <!-- Bootstrap JS: necesario para carousel, navbar mobile, modales -->
    <!-- IMPORTANTE: va ANTES que navbar.js y footer.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./src/js/navbar.js"></script>
    <script src="./src/js/footer.js"></script>
    <!-- No ponemos el main.js por que no lo necesitamos en esta página -->
  </body>
</html>
