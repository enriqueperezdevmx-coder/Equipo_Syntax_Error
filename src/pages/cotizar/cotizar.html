<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cotizar envío</title>

    <link rel="stylesheet" href="/src/css/variables.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="cotizar.css" />
  </head>

  <body>
    <div id="navbar"></div>
    <!--Formulario-->

    <!--Inicio de formulario tipo de envio-->
    <div class="tarjeta-formulario">
      <label for="Tipo de envio" class="etiqueta-envio">Tipo de envio:</label>
      <select
        id="tipo-de-envio"
        class="selector-envio"
        aria-label="Selecciona el tipo de envio"
      >
        <option selected disabled>Selecciona el tipo de envio</option>
        <option value="1">Express</option>
        <option value="2">Corporativo</option>
        <option value="3">Exclusivo</option>
        <option value="4">Extraordinario</option>
      </select>
    </div>
    <!-- Fin de formulario tipo de envio -->

    <!--Inicio Formulario general-->

    <div class="row g-3">
      <div class="col-sm">
        <input
          type="number"
          class="form-control"
          placeholder="Codigo Postal de Origen"
          aria-label="Zip"
        />
      </div>

      <div class="col-sm">
        <input
          type="number"
          class="form-control"
          placeholder="Codigo Postal de Destino"
          aria-label="Zip"
        />
      </div>

      <div class="col-sm">
        <input
          type="text"
          class="form-control"
          placeholder="Peso del Paquete (Kg)"
          aria-label="Zip"
        />
      </div>
    </div>

    <div class="row g-3">
      <div class="col-sm">
        <input
          type="text"
          class="form-control"
          placeholder="Nombre del Remitente"
          aria-label="text"
        />
      </div>

      <div class="col-sm">
        <input
          type="text"
          class="form-control"
          placeholder="Nombre del Destinatario"
          aria-label="text"
        />
      </div>

      <div class="col-sm">
        <input
          type="number"
          class="form-control"
          placeholder="Ancho del paquete (cm)"
          aria-label="number"
        />
      </div>
    </div>

    <div class="row g-3">
      <div class="col-sm">
        <input
          type="text"
          class="form-control"
          placeholder="Direccion de Origen"
          aria-label="text"
        />
      </div>

      <div class="col-sm">
        <input
          type="text"
          class="form-control"
          placeholder="Direccion del Destinatario"
          aria-label="text"
        />
      </div>

      <div class="col-sm">
        <input
          type="number"
          class="form-control"
          placeholder="Alto del paquete (cm)"
          aria-label="number"
        />
      </div>
    </div>

    <div class="row g-3">
      <div class="col-sm">
        <input
          type="email"
          class="form-control"
          placeholder="Correo electronico"
          aria-label="email"
        />
      </div>

      <div class="col-sm">
        <input
          type="number"
          class="form-control"
          placeholder="Telefono del Destinatario"
          aria-label="number"
        />
      </div>

      <div class="col-sm">
        <input
          type="text"
          class="form-control"
          placeholder="Descripcion del Contenido"
          aria-label="text"
        />
      </div>
    </div>

    <!--Fin Formulario general-->

    <!--Forms -->
    <!-- FOOTER -->
    <div id="footer"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/src/js/navbar.js"></script>
    <!-- IMPORTANTE: naEs mejor usar ruta absoluta porque evita problemas con las rutas relativas -->
    <script src="/src/js/footer.js"></script>
  </body>
</html>
