<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cotizar envío</title>

    <link rel="stylesheet" href="/src/css/variables.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="cotizar.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <div class="tarjeta-formulario mb-4 d-flex align-items-center">
      <label for="tipo-de-envio" class="etiqueta-envio me-3 mb-0"
        >Tipo de envio:</label
      >
      <select
        id="tipo-de-envio"
        class="form-select selector-envio"
        aria-label="Selecciona el tipo de envio"
      >
        <option selected disabled>Selecciona el tipo de envio</option>
        <option value="1">Express</option>
        <option value="2">Corporativo</option>
        <option value="3">Exclusivo</option>
        <option value="4">Extraordinario</option>
      </select>
    </div>
    <div class="row g-4">
      <div class="col-md-6 d-flex flex-column gap-3">
        <div class="row g-2">
          <div class="col-12">
            <label class="form-label mb-1 fw-semibold"
              >Nombre del Remitente</label
            >
            <input
              type="text"
              class="form-control"
              placeholder="Nombre completo"
              aria-label="text"
            />
          </div>
          <div class="col-md-8">
            <label class="form-label mb-1 fw-semibold"
              >Direccion de Origen</label
            >
            <input
              type="text"
              class="form-control"
              placeholder=""
              aria-label="text"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label mb-1 fw-semibold">C.P. Origen</label>
            <input
              type="number"
              class="form-control"
              placeholder=" "
              aria-label="Zip"
            />
          </div>
        </div>

        <div>
          <label class="form-label mb-1 fw-semibold">Correo electronico</label>
          <input
            type="email"
            class="form-control"
            placeholder=""
            aria-label="email"
          />
        </div>

        <div class="row g-2">
          <div class="col-12">
            <label class="form-label mb-1 fw-semibold"
              >Nombre del Destinatario</label
            >
            <input
              type="text"
              class="form-control"
              placeholder="Nombre completo"
              aria-label="text"
            />
          </div>
          <div class="col-md-8">
            <label class="form-label mb-1 fw-semibold"
              >Direccion del Destinatario</label
            >
            <input
              type="text"
              class="form-control"
              placeholder="Direccion completa"
              aria-label="text"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label mb-1 fw-semibold">C.P. Destino</label>
            <input type="number" class="form-control" aria-label="Zip" />
          </div>
        </div>

        <div>
          <label class="form-label mb-1 fw-semibold"
            >Telefono del Destinatario</label
          >
          <input
            type="number"
            class="form-control"
            placeholder="A 10 digitos"
            aria-label="tel"
          />
        </div>
      </div>

      <div class="col-md-6 d-flex flex-column gap-1">
        <div class="flex-grow-1 d-flex flex-column">
          <label class="form-label mb-1 fw-semibold"
            >Descripcion del Contenido</label
          >
          <textarea
            class="form-control flex-grow-1"
            placeholder="Sea lo mas descriptivo posible"
            aria-label="text"
            rows="4"
          ></textarea>
        </div>
        <div>
          <label class="form-label mb-1 fw-semibold"
            >Peso del Paquete (Kg)</label
          >
          <input
            type="number"
            class="form-control"
            placeholder=""
            aria-label="number"
          />
        </div>
        <div>
          <label class="form-label mb-1 fw-semibold"
            >Ancho del paquete (cm)</label
          >
          <input
            type="number"
            class="form-control"
            placeholder=""
            aria-label="number"
          />
        </div>
        <div>
          <label class="form-label mb-1 fw-semibold"
            >Alto del paquete (cm)</label
          >
          <input
            type="number"
            class="form-control"
            placeholder=""
            aria-label="number"
          />
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-4">
      <button type="button" class="btn boton-enviar boton-sm">Enviar</button>
    </div>

    <!-- FOOTER -->
    <div id="footer"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/src/js/navbar.js"></script>
    <!-- IMPORTANTE: naEs mejor usar ruta absoluta porque evita problemas con las rutas relativas -->
    <script src="/src/js/footer.js"></script>
  </body>
</html>
