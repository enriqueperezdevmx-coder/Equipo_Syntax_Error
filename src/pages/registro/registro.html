<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro — Mensajería Total</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700&family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/css/variables.css" />
    <link rel="stylesheet" href="/src/css/navbar.css" />
    <link rel="stylesheet" href="/src/css/footer.css" />
    <link rel="stylesheet" href="registro.css" />
  </head>
  <body>
    <div id="navbar"></div>

    <main class="container-fluid p-0">
      <div class="row g-0 min-vh-100">
        <div
          class="col-lg-6 d-flex flex-column justify-content-center align-items-center bg-white p-4 p-md-5 position-relative"
        >
          <div class="w-100 mt-5 pt-5" style="max-width: 450px">
            <div class="text-center mb-4">
              <h1
                class="display-6 fw-normal text-dark"
                style="letter-spacing: 2px"
              >
                Registro
              </h1>
              <p class="text-success fw-medium">
                La mensajería que tú y tus clientes se merecen
              </p>
            </div>

            <div id="alertas-contenedor"></div>

            <form id="form-registro" novalidate>
              <div class="mb-3">
                <label for="nombres" class="form-label text-muted small fw-bold"
                  >Nombres</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="nombres"
                  placeholder="Ej. Carlos"
                  required
                />
              </div>

              <div class="mb-3">
                <label
                  for="apellidos"
                  class="form-label text-muted small fw-bold"
                  >Apellidos</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="apellidos"
                  placeholder="Ej. Sánchez"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="correo" class="form-label text-muted small fw-bold"
                  >Correo Electrónico</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="correo"
                  placeholder="correo@ejemplo.com"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="celular" class="form-label text-muted small fw-bold"
                  >Número Celular</label
                >
                <input
                  type="tel"
                  class="form-control"
                  id="celular"
                  placeholder="10 dígitos"
                  maxlength="10"
                  required
                />
              </div>

              <div class="mb-3">
                <label
                  for="password"
                  class="form-label text-muted small fw-bold"
                  >Contraseña</label
                >
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Mínimo 12 caracteres"
                  required
                />
              </div>

              <div class="mb-4">
                <label
                  for="confirmar-password"
                  class="form-label text-muted small fw-bold"
                  >Confirmar Contraseña</label
                >
                <input
                  type="password"
                  class="form-control"
                  id="confirmar-password"
                  placeholder="Repite tu contraseña"
                  required
                />
              </div>

              <button
                type="submit"
                class="btn btn-success w-100 py-2 fw-bold rounded-pill"
              >
                Registrate
              </button>
            </form>

            <div class="text-center mt-4">
              <a
                href="/index.html"
                class="text-muted text-decoration-none small"
                ><i class="bi bi-arrow-left"></i> Volver al inicio</a
              >
            </div>
          </div>
        </div>

        <div class="col-lg-6 d-none d-lg-block bg-light">
          <img
            src="/src/assets/MT-1.jfif"
            alt="Mensajería Total"
            class="w-100 h-100 object-fit-cover"
          />
        </div>
      </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/src/js/navbar.js"></script>
    <script src="/src/js/sesion.js"></script>
    <script src="/src/js/footer.js"></script>
    <script src="registro.js"></script>
  </body>
</html>
